<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Fallera con traje de valenciana, tres moños y peineta: ilustración original -->
  <defs>
    <pattern id="espoli" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#3fa9ff"/>
      <g fill="#ffd21f" stroke="#14072a" stroke-width="2">
        <circle cx="16" cy="16" r="7"/>
        <circle cx="48" cy="48" r="7"/>
      </g>
      <g fill="#ff3b30">
        <circle cx="16" cy="16" r="3"/>
        <circle cx="48" cy="48" r="3"/>
      </g>
      <path d="M40 14 q8 -6 14 0 M6 46 q8 -6 14 0" stroke="#1e7a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
    </pattern>
    <pattern id="encaje" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#fffaf0"/>
      <circle cx="14" cy="14" r="6" fill="none" stroke="#c9c0e6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#c9c0e6"/>
      <circle cx="28" cy="28" r="3" fill="#c9c0e6"/>
    </pattern>
  </defs>
  <g stroke="#14072a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- peineta grande del moño de atrás -->
    <path d="M330 250 Q330 150 400 128 Q420 96 456 104 Q480 72 512 76 Q544 72 568 104 Q604 96 624 128 Q694 150 694 250 Q600 215 512 215 Q424 215 330 250 Z" fill="#ffc61a"/>
    <g fill="#14072a" stroke="none">
      <circle cx="420" cy="170" r="11"/><circle cx="466" cy="146" r="11"/><circle cx="512" cy="138" r="12"/>
      <circle cx="558" cy="146" r="11"/><circle cx="604" cy="170" r="11"/>
      <circle cx="466" cy="190" r="7"/><circle cx="512" cy="182" r="7"/><circle cx="558" cy="190" r="7"/>
    </g>
    <!-- moño de atrás -->
    <ellipse cx="512" cy="262" rx="150" ry="62" fill="#3a2414"/>
    <!-- cuerpo: traje de espolín -->
    <path d="M190 1030 Q200 760 360 700 L664 700 Q824 760 834 1030 Z" fill="url(#espoli)"/>
    <!-- manteleta de encaje -->
    <path d="M300 712 L512 900 L724 712 Q690 690 664 688 L360 688 Q334 690 300 712 Z" fill="url(#encaje)"/>
    <!-- cuello -->
    <path d="M452 600 L452 700 Q512 740 572 700 L572 600 Z" fill="#f2c4a0"/>
    <!-- joya del pecho -->
    <path d="M512 742 l26 30 l-26 34 l-26 -34 Z" fill="#ffc61a"/>
    <circle cx="512" cy="772" r="9" fill="#ff3b30"/>
    <!-- cabeza -->
    <ellipse cx="512" cy="450" rx="168" ry="196" fill="#f6cfae"/>
    <!-- pelo con raya en medio -->
    <path d="M346 430 Q350 270 512 262 Q674 270 678 430 Q640 330 512 326 Q384 330 346 430 Z" fill="#3a2414"/>
    <path d="M512 270 L512 326" stroke-width="6"/>
    <!-- rodetes laterales -->
    <circle cx="340" cy="430" r="78" fill="#3a2414"/>
    <circle cx="684" cy="430" r="78" fill="#3a2414"/>
    <path d="M300 410 Q340 380 380 410 M300 450 Q340 420 380 450 M644 410 Q684 380 724 410 M644 450 Q684 420 724 450" stroke="#6b4426" stroke-width="7" fill="none"/>
    <!-- agujas de oro de los rodetes -->
    <path d="M276 430 L392 430 M632 430 L748 430" stroke="#ffc61a" stroke-width="12"/>
    <circle cx="276" cy="430" r="14" fill="#ffc61a"/>
    <circle cx="748" cy="430" r="14" fill="#ffc61a"/>
    <!-- pendientes -->
    <path d="M378 548 l0 26 m0 0 l-16 26 l16 26 l16 -26 Z" fill="#ffc61a" stroke-width="7"/>
    <path d="M646 548 l0 26 m0 0 l-16 26 l16 26 l16 -26 Z" fill="#ffc61a" stroke-width="7"/>
    <!-- cara -->
    <path d="M440 456 Q462 436 484 456 M540 456 Q562 436 584 456" fill="none" stroke-width="9"/>
    <path d="M470 540 Q512 578 554 540" fill="none" stroke-width="9"/>
  </g>
  <!-- coloretes -->
  <circle cx="430" cy="512" r="26" fill="#ff7a8a" opacity="0.6"/>
  <circle cx="594" cy="512" r="26" fill="#ff7a8a" opacity="0.6"/>
  <!-- ramo de claveles -->
  <g stroke="#14072a" stroke-width="9" stroke-linejoin="round">
    <path d="M610 1030 L700 820 L790 1030 Z" fill="#fffaf0"/>
    <circle cx="670" cy="830" r="44" fill="#ff3b30"/>
    <circle cx="735" cy="800" r="44" fill="#ff5a7a"/>
    <circle cx="790" cy="850" r="44" fill="#ff3b30"/>
    <circle cx="720" cy="870" r="40" fill="#ffffff"/>
  </g>
  <g stroke="#14072a" stroke-width="5" fill="none">
    <path d="M650 820 q20 14 40 0 M715 790 q20 14 40 0 M770 840 q20 14 40 0 M700 862 q20 14 40 0"/>
  </g>
</svg>
